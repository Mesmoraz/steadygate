[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "steadygate"
version = "0.1.0"
description = "A statistical release gate for non-deterministic systems: LLM agents, evals, and flaky test suites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taylor Philpott" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["ci", "evals", "llm", "testing", "quality-gate", "regression", "flaky-tests"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-psutil",
  "httpx>=0.27",
  "hypothesis>=6.100",
]
companion = ["fastapi>=0.110", "uvicorn>=0.29", "psutil>=5.9"]
installer = ["pyinstaller>=6.10"]

[project.scripts]
steadygate = "steadygate.cli:main"

[project.urls]
Homepage = "https://mesmoraz.github.io/steadygate/"
Repository = "https://github.com/Mesmoraz/steadygate"
Issues = "https://github.com/Mesmoraz/steadygate/issues"
Changelog = "https://github.com/Mesmoraz/steadygate/blob/main/CHANGELOG.md"

# Only what a source build needs, so local scratch files never ship in the sdist.
[tool.hatch.build.targets.sdist]
include = ["/src/steadygate", "/tests", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/steadygate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=steadygate --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "site", "installer"]
