name: Release

on:
  push:
    # Full versions only, so pushing v1 or a pre-release tag by hand never publishes.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # workflow_dispatch only works once this file is on the default branch, so pull
  # requests that touch the build run it too (the release job below stays tag-only).
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build dependencies
        run: python -m pip install ".[installer]"
      - name: Build the CLI and the setup wizard
        run: python installer/build.py --out dist-installer
      - name: Smoke-test the built CLI
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cli=dist-installer/steadygate.exe; else cli=dist-installer/steadygate; fi
          bash installer/smoke.sh "$cli"
      - name: Self-check the setup wizard
        run: |
          case "$RUNNER_OS" in
            Windows) dist-installer/steadygate-setup-windows.exe --self-check ;;
            macOS)
              unzip -q dist-installer/steadygate-setup-macos.zip -d x
              x/steadygate-setup.app/Contents/MacOS/steadygate-setup --self-check
              ;;
            *) dist-installer/steadygate-setup-linux --self-check ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ runner.os }}
          path: dist-installer/steadygate-setup-*
          if-no-files-found: error

  # The Python package for PyPI. Built on every run so a broken sdist shows up before a tag.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The tag, pyproject and __version__ agree
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m pip install --quiet dist/*.whl
          installed=$(steadygate --version)
          [ "$installed" = "steadygate $version" ] || { echo "::error::pyproject says $version, CLI says $installed"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  # Trusted publishing: PyPI trusts this workflow, so no API token is stored in the repo.
  # One-time setup on pypi.org: add a (pending) publisher for Mesmoraz/steadygate,
  # workflow release.yml, environment pypi.
  pypi:
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/steadygate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, package, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: setup-*
          merge-multiple: true
      - name: Publish the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" assets/* --generate-notes --title "$GITHUB_REF_NAME"
      - name: Move the v1 tag to this release
        run: git tag -f v1 "$GITHUB_SHA" && git push -f origin v1
