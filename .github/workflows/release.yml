name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build dependencies
        run: python -m pip install ".[installer]"
      - name: Build the CLI and the setup wizard
        run: python installer/build.py --out dist-installer
      - name: Smoke-test the built CLI
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cli=dist-installer/steadygate.exe; else cli=dist-installer/steadygate; fi
          bash installer/smoke.sh "$cli"
      - name: Self-check the setup wizard
        run: |
          case "$RUNNER_OS" in
            Windows) dist-installer/steadygate-setup-windows.exe --self-check ;;
            macOS)
              unzip -q dist-installer/steadygate-setup-macos.zip -d x
              x/steadygate-setup.app/Contents/MacOS/steadygate-setup --self-check
              ;;
            *) dist-installer/steadygate-setup-linux --self-check ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ runner.os }}
          path: dist-installer/steadygate-setup-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" assets/* --generate-notes --title "$GITHUB_REF_NAME"
      - name: Move the v1 tag to this release
        run: git tag -f v1 "$GITHUB_SHA" && git push -f origin v1
